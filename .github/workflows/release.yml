name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.7.0-rc1). Must already exist.'
        required: true
        type: string
      tytus_os_ref:
        description: 'Immutable tytus-os tag or commit SHA to build and embed'
        required: true
        type: string

permissions:
  contents: write

env:
  TYTUS_OS_REF: ${{ inputs.tytus_os_ref }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: tytus-macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            name: tytus-macos-aarch64
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: tytus-linux-x86_64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            name: tytus-windows-x86_64
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:

      - name: Validate immutable tytus-os ref
        shell: bash
        run: |
          if [[ -z "${TYTUS_OS_REF}" ]]; then
            echo "tytus_os_ref is required for deterministic releases" >&2
            exit 1
          fi
          if [[ "${TYTUS_OS_REF}" == "main" || "${TYTUS_OS_REF}" == feature/* ]]; then
            echo "release tytus_os_ref must be an immutable tag or commit SHA, not moving branch: ${TYTUS_OS_REF}" >&2
            exit 1
          fi

      - name: Checkout tytus-cli
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          path: tytus-cli

      - name: Checkout tytus-os
        uses: actions/checkout@v5
        with:
          repository: traylinx/tytus-os
          ref: ${{ env.TYTUS_OS_REF }}
          path: tytus-os

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        working-directory: tytus-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tytus-os/package-lock.json

      - name: Build TytusOS dist
        working-directory: tytus-os
        run: |
          npm ci
          npm run build:packages
          npm run typecheck
          npm run build
          npm run test

      - name: Embed TytusOS dist
        working-directory: tytus-cli
        env:
          TYTUS_OS_SOURCE: ${{ github.workspace }}/tytus-os
        run: scripts/sync-tytus-os-dist.sh --sync
        shell: bash

      - name: Build Rust binaries
        working-directory: tytus-cli
        run: |
          cargo build --release -p atomek-cli --target ${{ matrix.target }}
          cargo build --release -p tytus-mcp --target ${{ matrix.target }}
          cargo build --release -p tytus-tray --target ${{ matrix.target }}
        shell: bash

      - name: Build unsigned macOS pkg dry-run
        if: runner.os == 'macOS'
        working-directory: tytus-cli
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          pkg/build-pkg.sh
          ls -la target/Tytus-*-unsigned.pkg
        shell: bash

      - name: Package
        working-directory: tytus-cli
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Force -Path tytus.exe,tytus-mcp.exe,tytus-tray.exe -DestinationPath ../../../${{ matrix.name }}.zip"
          else
            tar czf ../../../${{ matrix.name }}.tar.gz tytus tytus-mcp tytus-tray
          fi
          cd ../../..
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: tytus-cli/${{ matrix.name }}.${{ matrix.archive }}

      - name: Upload unsigned macOS pkg dry-run artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-unsigned-DO-NOT-DISTRIBUTE-pkg
          path: tytus-cli/target/Tytus-*-unsigned.pkg
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          ls -la dist/

      - name: Assert unsigned pkg artifacts are not public release payload
        run: |
          if find dist -type f \( -name '*.pkg' -o -name '*unsigned*' \) | grep -q .; then
            echo "unsigned/internal pkg artifact reached public release payload" >&2
            find dist -type f \( -name '*.pkg' -o -name '*unsigned*' \) -print >&2
            exit 1
          fi
          echo "Public release payload excludes unsigned pkg dry-run artifacts."

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS || sha256sum *.tar.gz > SHA256SUMS
          echo "── SHA256SUMS ──"
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false
